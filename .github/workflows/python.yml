name: Python Tests

on: [ push, pull_request ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Установка зависимостей (уже есть у тебя)

      # 2. Запуск тестов
      - name: Run tests
        continue-on-error: true
        run: |
          export JAVA_HOME=$JAVA_HOME
          pytest ./tests --alluredir=allure-results --disable-warnings -v -s

      # 3. Отладка: ищем swagger-coverage-отчёт
      - name: Find any swagger-coverage HTML
        if: ${{ always() }}
        run: |
          echo "=== Searching whole workspace for swagger-coverage*.html ==="
          find /home/runner/work/dm_api_tests -name "swagger-coverage*.html" 2>/dev/null || true

      # 4. Перемещаем отчёт из ./tests в корень (если создался там)
      - name: Move Swagger coverage report to root
        if: ${{ always() }}
        run: |
          if [ -f ./tests/swagger-coverage-dm-api-account.html ]; then
            mv ./tests/swagger-coverage-dm-api-account.html ./swagger-coverage-dm-api-account.html
          fi

      # 5. Запуск бота (ожидает файл в корне)
      - name: Run Coverage
        if: ${{ always() }}
        run: python -m packages.notifier.bot

      - name: Arhive allure results
        uses: actions/upload-artifact@v4
        with :
          name: allure-results
          path: allure-results
          retention-days: 1

  generate_report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: 17
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz && sudo tar -xvzf allure-2.34.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.34.1/bin/allure /usr/bin/allure
      - name: Download allure results
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site
      - name: Store report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

  puplish-report:
    runs-on: ubuntu-latest
    needs: generate_report
    name: Publish-report
    steps:
      - name: Download allure results
        uses: actions/download-artifact@v4
      - name: Upload allure report
        uses: actions/upload-pages-artifact@v4
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - run: echo 'https://supervlad52.github.io/dm_api_tests/'


